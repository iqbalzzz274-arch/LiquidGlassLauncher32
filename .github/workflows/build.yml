name: Build Liquid Glass Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            \( -iname "*.zip" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            echo "Project structure:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLauncher-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
