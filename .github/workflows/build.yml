name: Build Liquid Glass Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found."
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -type f \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find project -type f \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find project -maxdepth 5 -type f
            exit 1
         
